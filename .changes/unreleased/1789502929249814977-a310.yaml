kind: 'Fixed'
body: 'fixed a window that ends exactly at midnight — a calendar month picked on a table or on a detail page — reading one day past its end. Snapshots and the per-day coding time and ticket rows are read by inclusive day, and the first instant of October was being converted to the first *of* October, so September carried one extra day of measures and the snapshot taken after it: in the tables, on both detail pages and in the last bucket of every trend. Every read now ends on the day before `to` whenever `to` lands on midnight, which is the day the buckets already ended on'
