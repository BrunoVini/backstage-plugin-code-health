kind: 'Added'
body: 'added a distinct reading for a repository SonarQube analyses but publishes no coverage measure for, which until now was shown as the same dash as a repository with no Sonar project at all. The Repositories and Contributors tables mark it "not reported" with a warning icon explaining that no coverage report is produced or imported for it, and the Insights coverage card gains a "No coverage reported" tile counting them, because the card''s average, median and below-target figures all leave those repositories out and nothing on the page said they existed. Leaving the metric out of the score without showing why is what let seven projects sit unmeasured unnoticed; the score still excludes them, and this is the part that says so'
