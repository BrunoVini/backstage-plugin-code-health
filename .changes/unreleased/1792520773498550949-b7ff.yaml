kind: 'Fixed'
body: 'fixed post-merge pipeline runs being credited to whoever completed the pull request whenever they were read in a later ingestion window than the pull request: the incremental window is the few minutes since the last run, so a build finishing minutes after its merge fell outside the window that saw the merge, and the lookup that credits a build to the pull request''s author held only that window''s pull requests. Both collectors now also look up the pull requests merged in the two days before each window, while still counting a pull request, its reviews and the commits it brought in only in the window it closed in'
