kind: 'Changed'
body: 'changed the productivity score to read output as a **rate against the team''s average rate** rather than as a share of the top figure anybody recorded. Each total is divided by the days the range spans and read against the mean across the people the component could be measured on, with twice that mean scoring full marks. Against the maximum, one person''s extraordinary month pushed every colleague down for reasons that had nothing to do with them, and a single automation nobody had excluded yet could flatten a whole team at once; against the mean, keeping pace with the team scores half and an outlier moves the reference by its share of the headcount. Reading a rate rather than a total also stops somebody who joined halfway through the range being measured as though they had been there for all of it. Every score on the Contributors tab and on a person''s detail page moves — a lone contributor, who is the team average by definition, now scores mid-range where they used to score full marks. `fleetReferenceOf` takes the window''s day count as a second argument and `FleetReference` carries it'
