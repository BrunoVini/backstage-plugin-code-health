kind: 'Changed'
body: '**BREAKING CHANGE:** changed the productivity score to read output as a **rate against the team''s average rate** rather than as a share of the top figure anybody recorded. Each total is divided by the days the range spans and read against the mean across the people the component could be measured on, with twice that mean scoring full marks. Against the maximum, one person''s extraordinary month pushed every colleague down for reasons that had nothing to do with them, and a single automation nobody had excluded yet could flatten a whole team at once; against the mean, keeping pace with the team scores half and an outlier moves the reference by its share of the headcount. Reading a rate rather than a total is what lets a figure mean the same thing whatever range is picked; it does not correct for tenure or absence, because everybody is divided by the same window. On a person''s detail page each bucket is read against the same people the whole window measured, with somebody quiet in a bucket counted as a zero there rather than left out of the mean, so the line under the headline is the same quantity as the headline. Every score on the Contributors tab and on a person''s detail page moves — a lone contributor, who is the team average by definition, now scores mid-range where they used to score full marks. The break is in `@rios0rios0/backstage-plugin-code-health-common`: `fleetReferenceOf` now takes the window''s day count as a required second argument, so a host calling it with one stops compiling, and `FleetReference` carries that count as `days`, which anything constructing a reference by hand has to supply — spreading `EMPTY_FLEET_REFERENCE` still compiles'
