kind: 'Fixed'
body: 'fixed the commits of an Azure DevOps pull request completed with a merge commit being stored with no changed files, because neither the pull request''s commit list nor `commitsbatch` reports change counts, and a rebase-and-merge storing the commits as written rather than as landed, which the branch history could then count a second time under the rewritten identifiers. Each such pull request is now read, in the window it closes, with one commit list request between the target branch''s tip it merged into and its merge commit, paged past two hundred commits: that returns exactly the commits the completion put on the branch, with their change counts. A pull request missing either commit is skipped with a warning'
time: '2026-10-08T22:35:40.064396700Z'
