kind: 'Added'
body: 'added the ability to exclude an account from every measurement the plugin makes, from the **Identities** tab, under one of four required reasons — former contributor, open source contributor, automated bot, or service or system account. An excluded account gets no contributor row at all rather than a zeroed one, stops counting towards a repository''s counters and the fleet delivery cadence, and — the reason this matters most — stops setting the fleet reference that commits, merged pull requests, churn and reviews are scored against. The exclusion is a statement about a *person*, so excluding one account of somebody the link table says is one human excludes all of their accounts. Nothing is deleted: the reason and its author are stored, and measuring the account again restores every window already collected'
