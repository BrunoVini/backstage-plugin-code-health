kind: 'Fixed'
body: 'fixed the productivity score rewarding a contributor for losing more churn data than a colleague: a churn total sums every commit in the window and a commit no provider reported a figure for enters it as a zero, indistinguishable from one that changed nothing, so a row whose every figure was lost read as churnUnit none -- which dropped the component and redistributed its weight over the components that were measured -- while a row that kept 1 of 18 commits and 4 of 31 changed files was scored on that fraction, making total data loss strictly better than partial loss. ContributorSummary now carries churnScope, the commits that carried a figure in the row''s own unit against those that did not, and a window with commits and no surviving figure is scored a measured zero rather than dropped, unless nothing in the fleet measures churn at all; the measured figure is never scaled up to the full commit count, since extrapolating from the commits that survived can score above the truth, and the component''s sentence discloses the scope instead'
