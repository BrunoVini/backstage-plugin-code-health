kind: 'Fixed'
body: 'fixed commits that reached the default branch after their committer date being lost for good: the history query filtered on the committer date of a window only minutes long, so a commit pushed an hour after it was made missed its own window and no later window read that date again. Both collectors now read the history from a day before each window, which the store absorbs by keeping one event per identifier. An Azure DevOps rebase completion of a branch already up to date with its target fast-forwards it without rewriting anything, so its commits kept their old dates and were lost the same way; its landed commits are now fetched from the pull request like a merge commit''s, and kept under their authors'
