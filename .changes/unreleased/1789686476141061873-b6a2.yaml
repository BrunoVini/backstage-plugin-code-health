kind: 'Changed'
body: 'changed the snapshot pass to give every source a request allowance of its own: the repository loop and its Sonar readings spend `codeHealth.ingestion.requestBudgetPerRun`, and WakaTime, Jira and Confluence each spend a new `requestBudgetPerRun` under their own configuration block — 500, 500 and 2,700 by default, Confluence''s derived from its page caps so a walk the caps allow is never cut short, and its per-space reports paid from a separate `requestBudgetPerSpace` for each space the catalog names, since their cost scales with the annotation count rather than with the caps. The enrichers used to draw on the ingestion budget before a single repository was captured, so one large Confluence space or Jira project could leave the repository loop, the only part of the pass nothing else can record, with nothing. The pass now ends with what each source spent by name, and warns, naming the setting to raise, when it left repositories unvisited, when Sonar could not be asked about some of them, or when an integration was refused a request and stopped short'
