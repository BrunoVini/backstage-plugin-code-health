nodeLinker: 'node-modules'

# Wait a week before resolving newly published versions, so a compromised release
# has time to be caught and unpublished before it reaches this repository.
npmMinimalAgeGate: '7d'

# Suppressions are a last resort, used only where no version can fix the finding.
# Anything upstream has patched belongs in `resolutions` in `package.json`, which
# raises the installed version instead of hiding the report — that is where every
# brace-expansion advisory is handled, pinned per major line.
npmAuditIgnoreAdvisories:
  # GHSA-86w9-cpqp-85rv — node-forge accepts extra nested DigestAlgorithm
  # elements when verifying an RSA PKCS#1 v1.5 signature.
  #
  # Unfixable: every published version is vulnerable, `latest` (1.4.0) included,
  # so there is nothing to raise `resolutions` to.
  #
  # Unreachable as described: it arrives only through `selfsigned@2.4.1`, under
  # `@backstage/backend-defaults` and `@rspack/dev-server`, which generates
  # self-signed certificates for local HTTPS. The one verifying call it makes,
  # `forge.pki.verifyCertificateChain`, is a self-check — the CA store is loaded
  # with the certificate the same function generated moments earlier, and that
  # same certificate is what it verifies. The advisory is about accepting a
  # malformed signature from an attacker, and no attacker-supplied certificate
  # reaches this path. `selfsigned@5` drops node-forge entirely, but it swaps the
  # crypto backend for `@peculiar/x509` and `pkijs`, so moving two packages three
  # majors forward is a change with its own blast radius rather than a pin bump.
  #
  # Remove this when node-forge publishes a fixed release, or when the Backstage
  # dependencies move to `selfsigned@5` on their own.
  - 1240912
