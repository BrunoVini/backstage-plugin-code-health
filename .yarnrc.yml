nodeLinker: 'node-modules'

# Wait a week before resolving newly published versions, so a compromised release
# has time to be caught and unpublished before it reaches this repository.
npmMinimalAgeGate: '7d'

# Suppressions are a last resort, used only where no version can fix the finding.
# Anything upstream has patched belongs in `resolutions` in `package.json`, which
# raises the installed version instead of hiding the report — that is where every
# brace-expansion advisory is handled, pinned per major line.
npmAuditIgnoreAdvisories:
  # GHSA-86w9-cpqp-85rv — node-forge accepts extra nested DigestAlgorithm
  # elements when verifying an RSA PKCS#1 v1.5 signature.
  #
  # Unfixable: every published version is vulnerable, `latest` (1.4.0) included,
  # so there is nothing to raise `resolutions` to.
  #
  # Unreachable as described: it arrives only through `selfsigned@2.4.1`, under
  # `@backstage/backend-defaults` and `@rspack/dev-server`, which generates
  # self-signed certificates for local HTTPS. The one verifying call it makes,
  # `forge.pki.verifyCertificateChain`, is a self-check — the CA store is loaded
  # with the certificate the same function generated moments earlier, and that
  # same certificate is what it verifies. The advisory is about accepting a
  # malformed signature from an attacker, and no attacker-supplied certificate
  # reaches this path. `selfsigned@5` drops node-forge entirely, but it swaps the
  # crypto backend for `@peculiar/x509` and `pkijs`, so moving two packages three
  # majors forward is a change with its own blast radius rather than a pin bump.
  #
  # Remove this when node-forge publishes a fixed release, or when the Backstage
  # dependencies move to `selfsigned@5` on their own.
  - 1240912

  # GHSA-vfj7-8cjw-p6xm -- braces exhausts the stack on deeply nested patterns.
  #
  # Unfixable: no patched release exists. 3.0.3 is `latest` and 3.0.3 is the
  # vulnerable version, so there is nothing to raise `resolutions` to. It
  # arrives only through `chokidar@3.6.0`, which six Backstage and rspack
  # packages pin to `^3.x`; `chokidar@4` dropped glob support, so forcing it
  # is a breaking API change for all six rather than a pin bump.
  #
  # Remove this the day braces publishes a fix.
  - 1240992

  # GHSA-ch52-4w7c-c8xp -- http-cache-semantics can serve one user's cached
  # response to another under `max-stale`.
  #
  # A fix exists -- 4.3.0 -- and it was tried: a `resolutions` pin raises the
  # version and the audit goes green. It is not applied because of what it
  # costs. `http-cache-semantics` sits under `node-gyp`, so changing it changes
  # the dependency-tree hash of every natively built package, and
  # `better-sqlite3`, `cpu-features`, `keytar` and `ssh2` all rebuild from
  # source on the next install. In CI that exceeds the 15-minute job timeout
  # and the whole `code-check` stage is cancelled before any check reports --
  # a worse outcome than the finding itself.
  #
  # Reach is build tooling, not shipped runtime code: `node-gyp` only runs
  # while compiling native modules.
  #
  # Revisit when the shared pipeline's job timeout is raised. The entry that
  # fixes it is `"http-cache-semantics@npm:^4.1.1": "^4.3.0"` in resolutions.
  - 1240991

  # GHSA-68fv-2mgg-jv7q -- source-map-js event-loop DoS via indexed section
  # offsets. Fixed in 1.2.2, published 2026-09-30 -- five days old, so the
  # repository's seven-day `npmMinimalAgeGate` refuses to resolve it and the
  # install fails outright on YN0082 rather than falling back.
  #
  # This one expires by itself: drop this entry on 2026-10-07, add
  # `"source-map-js@npm:^1.2.0": "^1.2.2"` to resolutions, and the finding goes
  # away for real.
  - 1241209
